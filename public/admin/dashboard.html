<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administrador — Academia</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="franja"></div>

  <main class="acceso" style="grid-template-columns:1fr; max-width:720px;">
    <div class="acceso-marca">
      <p class="acceso-eyebrow">panel administrador</p>
      <h1>Estudiantes y configuración</h1>
      <p class="acceso-sub"><a href="chat.html" style="color:var(--verde-terminal);">💬 Hablar con el Profesor →</a>
        &nbsp;·&nbsp;
        <a href="chat-ingeniero.html" style="color:var(--ambar);">🛠️ Hablar con el Ingeniero →</a></p>
    </div>

    <div class="acceso-panel">
      <form id="form-donacion" class="form-acceso">
        <label>Enlace de donación PayPal
          <input type="url" name="paypalLink" placeholder="https://www.paypal.com/donate?hosted_button_id=...">
        </label>
        <button type="submit" class="btn-primario">Guardar enlace</button>
        <p class="error" id="msg-donacion"></p>
      </form>
    </div>

    <div class="acceso-panel" style="margin-top:1.5rem;">
      <p class="acceso-eyebrow" style="margin-bottom:0.6rem;">agente profesor</p>
      <form id="form-generar-clase" class="form-acceso">
        <label>ID del módulo (clase)
          <input type="text" name="moduloId" placeholder="ej. html-css-basico" required>
        </label>
        <label>Tema de la clase
          <input type="text" name="tema" placeholder="ej. selectores CSS y el modelo de caja" required>
        </label>
        <button type="submit" class="btn-primario">Generar clase</button>
        <p class="error" id="msg-clase"></p>
      </form>
      <hr style="border-color:var(--borde); margin:1.2rem 0;">
      <form id="form-generar-quiz" class="form-acceso">
        <label>ID del módulo (quiz)
          <input type="text" name="moduloId" placeholder="ej. html-css-basico" required>
        </label>
        <label>Propósito pedagógico (qué debe evaluar el quiz)
          <input type="text" name="proposito" placeholder="ej. selectores CSS y el modelo de caja" required>
        </label>
        <button type="submit" class="btn-primario">Generar quiz</button>
        <p class="error" id="msg-quiz"></p>
      </form>
      <hr style="border-color:var(--borde); margin:1.2rem 0;">
      <form id="form-adjuntar-media" class="form-acceso">
        <label>ID del módulo
          <input type="text" name="moduloId" placeholder="ej. html-css-basico" required>
        </label>
        <label>ID de la clase (el que se mostró al generarla)
          <input type="text" name="claseId" placeholder="ej. 1736700000000" required>
        </label>
        <label>Imagen o video
          <input type="file" name="archivo" accept="image/*,video/*" required>
        </label>
        <button type="submit" class="btn-primario">Adjuntar a la clase</button>
        <p class="error" id="msg-media"></p>
      </form>
    </div>

    <div class="acceso-panel" style="margin-top:1.5rem;">
      <p class="acceso-eyebrow" style="margin-bottom:0.6rem;">estudiantes</p>
      <div id="lista-estudiantes" style="display:flex; flex-direction:column; gap:0.6rem;">
        <p style="color:var(--texto-tenue); font-family:var(--fuente-mono); font-size:0.85rem;">
          Cargando…
        </p>
      </div>
    </div>

    <div class="acceso-panel" style="margin-top:1.5rem;">
      <p class="acceso-eyebrow" style="margin-bottom:0.6rem;">historial profesor ↔ ingeniero</p>
      <div id="lista-solicitudes" style="display:flex; flex-direction:column; gap:0.5rem; font-size:0.85rem;">
        <p style="color:var(--texto-tenue); font-family:var(--fuente-mono);">Cargando…</p>
      </div>
    </div>

    <div class="acceso-panel" style="margin-top:1.5rem;">
      <p style="color:var(--texto-tenue); font-family:var(--fuente-mono); font-size:0.85rem;">
        Pendiente: que configures tus credenciales reales de Firebase y Cloudinary.
        Ver docs/CONTINUACION.md.
      </p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
